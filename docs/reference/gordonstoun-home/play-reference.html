<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gordonstoun homepage reference</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: sans-serif;
      }
      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      img.on {
        opacity: 1;
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 18px;
        background: rgb(0 0 0 / 0.7);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage"></div>
    <div class="bar" id="caption"></div>
    <script>
      const frames = [
        ['00-eis-current-before-change.png', 'EIS homepage before the split-layout change'],
        ['01-hero-fullbleed.png', 'Gordonstoun 1: full-bleed cinematic hero with white frame'],
        ['02-split-plus-est-en-vous-user.jpg', 'Gordonstoun 2: text on the left, photo on the right'],
        ['03-split-text-beside-image.png', 'Gordonstoun 3: same split panel while scrolling'],
        ['04-scroll-transition.png', 'Gordonstoun 4: next story slides in as you scroll down'],
        ['05-carousel-story.png', 'Gordonstoun 5: later full-bleed / story panel'],
      ]
      const stage = document.getElementById('stage')
      const caption = document.getElementById('caption')
      const imgs = frames.map(([src]) => {
        const img = document.createElement('img')
        img.src = src
        stage.appendChild(img)
        return img
      })
      let i = 0
      function show() {
        imgs.forEach((img, n) => img.classList.toggle('on', n === i))
        caption.textContent = i + 1 + ' / ' + frames.length + ' — ' + frames[i][1]
      }
      show()
      setInterval(() => {
        i = (i + 1) % frames.length
        show()
      }, 2200)
    </script>
  </body>
</html>
