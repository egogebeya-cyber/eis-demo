services:
  - type: web
    name: eis-demo
    runtime: node
    plan: free
    region: oregon
    buildCommand: rm -rf node_modules && npm install --include=optional && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: NPM_CONFIG_OPTIONAL
        value: "true"
